<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Amazon Clone</title>
  <style>
    /* Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

    /* Header */
    header {
      background-color: #131921;
      color: white;
      display: flex;
      align-items: center;
      padding: 10px 20px;
    }

    header img {
      width: 100px;
      cursor: pointer;
    }

    .search-bar {
      flex: 1;
      margin: 0 20px;
      display: flex;
    }

    .search-bar input {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 2px 0 0 2px;
    }

    .search-bar button {
      padding: 8px 12px;
      border: none;
      background-color: #febd69;
      border-radius: 0 2px 2px 0;
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    /* Main */
    main {
      padding: 20px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .product {
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 10px;
      text-align: center;
      background-color: #fff;
    }

    .product img {
      width: 150px;
      height: 150px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .product h3 {
      font-size: 16px;
      margin-bottom: 5px;
    }

    .product p {
      font-weight: bold;
      color: #b12704;
    }

    .product button {
      padding: 8px 12px;
      margin-top: 10px;
      border: none;
      background-color: #f0c14b;
      cursor: pointer;
      border-radius: 2px;
    }

    /* Footer */
    footer {
      background-color: #131921;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Logo">
    <div class="search-bar">
      <input type="text" placeholder="Search products">
      <button>Search</button>
    </div>
    <div class="nav-links">
      <a href="#">Hello, Sign in</a>
      <a href="#">Orders</a>
      <a href="#">Cart</a>
    </div>
  </header>

  <main>
    <div class="product-grid">
      <div class="product">
        <img src="https://via.placeholder.com/150" alt="Product 1">
        <h3>Product 1</h3>
        <p>$19.99</p>
        <button>Add to Cart</button>
      </div>
      <div class="product">
        <img src="https://via.placeholder.com/150" alt="Product 2">
        <h3>Product 2</h3>
        <p>$29.99</p>
        <button>Add to Cart</button>
      </div>
      <div class="product">
        <img src="https://via.placeholder.com/150" alt="Product 3">
        <h3>Product 3</h3>
        <p>$39.99</p>
        <button>Add to Cart</button>
      </div>
      <div class="product">
        <img src="https://via.placeholder.com/150" alt="Product 4">
        <h3>Product 4</h3>
        <p>$49.99</p>
        <button>Add to Cart</button>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2025 My Amazon Clone. All rights reserved.
  </footer>
</body>
</html>
